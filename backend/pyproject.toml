[project]
name = "acadlens-backend"
version = "0.1.0"
description = "学术文本白盒诊断与人机协同精修系统 — 服务端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=2.0",
    "pyahocorasick>=2.1",
    "spacy>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# 中英文依存模型。体积较大，CI 可只装其一；缺失时 Track B 自动降级为词性近似骨架。
models = [
    "zh_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# spaCy 模型以 wheel URL 直引，需显式允许
[tool.hatch.metadata]
allow-direct-references = true

# ---------------------------------------------------------------------------
# Ruff：格式化 + lint，CI 非可选
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff 专有规则
    "ANN",      # 强制类型注解（补偿静态类型安全感）
    "PTH",      # 用 pathlib 替代 os.path
    "RET",      # return 规范
]
ignore = [
    "RUF001",   # 中文全角标点在字符串里是刻意的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]
# FastAPI 依赖注入必须写在参数默认值里，B008 在路由文件里是误报
"app/api/**/*.py" = ["B008"]

# ---------------------------------------------------------------------------
# mypy：strict 模式，跨层数据结构一律走 Pydantic，不传裸 dict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ahocorasick.*"]
ignore_missing_imports = true

# 测试函数一律返回 None，逐个标注 `-> None` 只是噪音；其余 strict 规则仍然生效。
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "needs_spacy_model: 需要已安装 spaCy 依存模型才能运行",
]
filterwarnings = [
    # starlette 提示改用 httpx2；TestClient 本身仍可用，等上游稳定后再迁移
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
